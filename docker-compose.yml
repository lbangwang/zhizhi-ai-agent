# D5: 本地基础设施（MySQL + Redis）
# 用法：
#   docker compose up -d
#   docker compose down
#
# 初始化：MySQL 首次启动会执行 src/main/resources/db/schema.sql
# 应用侧请在 .env 设置 MYSQL_ENABLED=true / REDIS_ENABLED=true 并填写连接信息

services:
  mysql:
    image: mysql:8.0
    container_name: zhizhi-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: zhizhi_ai_agent
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - zhizhi-mysql-data:/var/lib/mysql
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: zhizhi-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-root}"]
    volumes:
      - zhizhi-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-root}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  zhizhi-mysql-data:
  zhizhi-redis-data:
