server {
    listen       80;
    server_name  localhost;

    # 前端静态文件根目录（构建产物 dist 需拷贝到此目录）
    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # Gzip：API/SSE 单独关闭，避免流式响应被缓冲
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Vue Router history 模式：非真实文件一律回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（^~ /api/ 优先级更高，不会误伤接口）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 反向代理到云端后端（与前端请求路径 /api/zhizhi-ai/... 对齐）
    location ^~ /api/ {
        proxy_pass https://zhizhi-ai-agent-285438-10-1456848923.sh.run.tcloudbase.com/api/;

        # HTTPS 上游证书与 SNI
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        # 透传真实请求信息
        proxy_set_header Host zhizhi-ai-agent-285438-10-1456848923.sh.run.tcloudbase.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / 长连接（CC面试官 Flux、超级智能体 SseEmitter）
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 30s;

        proxy_intercept_errors off;
    }
}

