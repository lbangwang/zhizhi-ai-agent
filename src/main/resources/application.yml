spring:
  application:
    name: zhizhi-ai-agent
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  # D2: MySQL 连接占位。本地装好 MySQL 后在 .env 填写，并设置 MYSQL_ENABLED=true
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/zhizhi_ai_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # D5: Redis（REDIS_ENABLED=true 时启用；未启用则排除自动配置）
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3000ms
  ai:
    alibaba:
      chat:
        options:
          timeout: 60000  # 设置为60秒
    dashscope:
      # 通过环境变量注入，勿把真实 key 写入仓库
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: qwen-plus
    openai:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
      embedding:
        enabled: false          # DeepSeek 不支持 embedding，必须关

    # 豆包（火山方舟 OpenAI 兼容）
    # base-url 只需到 /api/v3，不要带 /chat/completions（SDK 会自动拼接路径）
    doubao:
      api-key: ${DOUBAO_API_KEY:}
      base-url: ${DOUBAO_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
      chat:
        options:
          model: ${DOUBAO_MODEL:doubao-seed-2-1-turbo-260628}
        # 方舟兼容接口路径是 /chat/completions，不是 OpenAI 默认的 /v1/chat/completions
        completions-path: /chat/completions
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_MODEL:qwen3.5:0.8b}

    # W3 D4：MCP Client（默认关；MCP_ENABLED=true 且已打包 image-search jar 后开启）
    mcp:
      client:
        enabled: ${MCP_ENABLED:false}
        stdio:
          servers-configuration: classpath:mcp-servers.json
#        sse:
#          connections:
#            server1:
#              url: http://localhost:8127
server:
  port: ${SERVER_PORT:8123}
  servlet:
    context-path: /api
# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.zhizhi.zhizhiaiagent
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

#日志打印
logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: debug



search-api:
  api-key: ${SEARCH_API_KEY:}


# MyBatis-Plus（仅在 MYSQL_ENABLED=true 时实际生效）
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: input
      table-underline: true
      logic-delete-field: isDel
      logic-delete-value: 1
      logic-not-delete-value: 0

# 数据源 / Redis / 知识库开关
app:
  datasource:
    enabled: ${MYSQL_ENABLED:true}
  redis:
    enabled: ${REDIS_ENABLED:false}
    stop-key-prefix: "zhizhi:chat:stop:"
    stop-ttl-seconds: 600
  # W2: Agent 产物受管存储（从 tmp 拷贝后供下载）
  artifact:
    file-dir: ${ARTIFACT_FILE_DIR:data/artifacts}
  # W3: HITL / MCP / Pexels
  hitl:
    timeout-seconds: ${HITL_TIMEOUT_SECONDS:120}
  mcp:
    merge-tools: ${MCP_MERGE_TOOLS:true}
  pexels:
    api-key: ${PEXELS_API_KEY:}
  # W2: 本地 VectorStore（SimpleVectorStore）知识库
  knowledge:
    file-dir: ${KNOWLEDGE_FILE_DIR:data/knowledge-files}
    vector-store-file: ${KNOWLEDGE_VECTOR_STORE_FILE:data/vector-store/knowledge-simple.json}
    # 切片策略：paragraph=按空行分段（超长回退 token）；token=纯 token 窗口切
    split-strategy: ${KNOWLEDGE_SPLIT_STRATEGY:paragraph}
    chunk-token-size: 400
    min-chunk-size-chars: 100
    min-chunk-length-to-embed: 10
    max-num-chunks: 5000
    # paragraph 专用：单段超过该字符数则 token 再切；0 表示自动取 chunk-token-size*2
    paragraph-max-chars: ${KNOWLEDGE_PARAGRAPH_MAX_CHARS:0}
    # paragraph 专用：短于该字符的段与下一段合并
    paragraph-min-merge-chars: ${KNOWLEDGE_PARAGRAPH_MIN_MERGE_CHARS:80}
    top-k: 4
    similarity-threshold: 0.45
    seed-classpath-docs: ${KNOWLEDGE_SEED_CLASSPATH:true}
    cloud-rag-enabled: ${KNOWLEDGE_CLOUD_RAG_ENABLED:false}

# D4: Sa-Token JWT
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: false
  is-read-header: true
  is-read-cookie: false
  is-log: false
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET:zhizhi-ai-agent-dev-jwt-secret-change-me}
